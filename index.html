<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BATIK BUDDY | KRUSS MAKERS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        
        body { 
            /* Latar Belakang Batik Overlay & Gradien Dark Cyan */
            background: 
                radial-gradient(circle at center, rgba(4, 18, 26, 0.75) 0%, rgba(2, 8, 12, 0.95) 100%),
                repeating-linear-gradient(45deg, rgba(56, 189, 248, 0.03) 0, rgba(56, 189, 248, 0.03) 15px, transparent 0, transparent 30px),
                linear-gradient(135deg, #021019 0%, #082f49 50%, #020617 100%);
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            min-height: 100vh; 
            padding: 25px 20px;
            overflow: hidden;
        }

        /* HEADER TOP */
        .header { text-align: center; margin-top: 5px; }
        .logo-title { font-size: 34px; font-weight: 900; letter-spacing: 10px; color: #ffffff; text-shadow: 0 0 15px rgba(56, 189, 248, 0.6); }
        .logo-sub { font-size: 11px; font-weight: 700; letter-spacing: 4px; color: #38bdf8; margin-top: 4px; }
        .logo-desc { font-size: 10px; font-weight: 600; letter-spacing: 3px; color: #94a3b8; margin-top: 4px; }

        /* CENTER TABLET FRAME WITH NEON GLOW */
        .tablet-container {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 16/9;
            background: #020617;
            border-radius: 24px;
            padding: 10px;
            box-shadow: 0 0 30px #0284c7, inset 0 0 15px rgba(2, 132, 199, 0.5);
            border: 2px solid #38bdf8;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* BADGE OVERLAY ON VIDEO */
        .sleep-badge {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        .dot-green {
            width: 8px;
            height: 8px;
            background-color: #14b8a6;
            border-radius: 50%;
            box-shadow: 0 0 8px #14b8a6;
        }

        /* INTERACTIVE BUTTON */
        .btn-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .touch-btn {
            width: 100%;
            background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 100%);
            color: #020617;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            padding: 16px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .touch-btn:active {
            transform: scale(0.98);
        }

        .tap-sub {
            font-size: 10px;
            letter-spacing: 3px;
            color: #94a3b8;
            margin-top: 8px;
            font-weight: 600;
        }

        /* BOTTOM CONNECTION BAR */
        .connection-bar {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid #ef4444;
            border-radius: 25px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.2);
            margin-bottom: 5px;
            backdrop-filter: blur(5px);
        }

        .status-light {
            width: 20px;
            height: 20px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 15px #ef4444;
            flex-shrink: 0;
        }

        .status-text {
            display: flex;
            flex-direction: column;
        }

        .status-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .status-desc {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #f87171;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- HEADER TOP -->
    <div class="header">
        <div class="logo-title">BATIK BUDDY</div>
        <div class="logo-sub">BY KRUSS MAKERS</div>
        <div class="logo-desc">YOUR BATIK MUSEUM GUIDE</div>
    </div>

    <!-- TABLET DISPLAY WITH VIDEO -->
    <div class="tablet-container">
        <div class="video-wrapper">
            <video id="sleepVid" autoplay loop muted playsinline>
                <source src="video-sleep.mp4" type="video/mp4">
            </video>
            <div class="sleep-badge">
                <span class="dot-green"></span>
                BUDDY IS IN SLEEP MODE
            </div>
        </div>
    </div>

    <!-- MAIN BUTTON -->
    <div class="btn-container">
        <button class="touch-btn" onclick="nextScreen()">
            ✦ TOUCH HERE TO BEGIN TOUR
        </button>
        <div class="tap-sub">TAP TO WAKE BUDDY</div>
    </div>

    <!-- CONNECTION BAR -->
    <div class="connection-bar">
        <div class="status-light"></div>
        <div class="status-text">
            <div class="status-title">iPad ⇄ SPIKE PRIME</div>
            <div class="status-desc">NOT CONNECTED<br>SIMULATION MODE</div>
        </div>
    </div>

    <script>
        function nextScreen() {
            alert("Sedia untuk bina Paparan 2!");
        }
    </script>

</body>
</html>
