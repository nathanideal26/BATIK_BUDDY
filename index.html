<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BATIK BUDDY | KRUSS MAKERS</title>
    <!-- IMPORT FONT BERSENI (CINZEL DECORATIVE) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
        
        body { 
            background: 
                radial-gradient(circle at center, rgba(4, 18, 26, 0.75) 0%, rgba(2, 8, 12, 0.95) 100%),
                repeating-linear-gradient(45deg, rgba(234, 179, 8, 0.03) 0, rgba(234, 179, 8, 0.03) 15px, transparent 0, transparent 30px),
                linear-gradient(135deg, #021019 0%, #082f49 50%, #020617 100%);
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            min-height: 100vh; 
            padding: 25px 20px;
            overflow: hidden;
        }

        /* HEADER TOP WITH GOLDEN GLOWING ARTISTIC FONT */
        .header { text-align: center; margin-top: 5px; }
        .logo-title { 
            font-family: 'Cinzel Decorative', serif;
            font-size: 36px; 
            font-weight: 900; 
            letter-spacing: 6px; 
            color: #fef08a; 
            text-shadow: 
                0 0 10px #eab308,
                0 0 20px #ca8a04,
                0 0 30px rgba(234, 179, 8, 0.8),
                0 0 40px rgba(234, 179, 8, 0.5);
        }
        .logo-sub { font-size: 11px; font-weight: 800; letter-spacing: 4px; color: #fde047; margin-top: 6px; text-shadow: 0 0 8px rgba(253, 224, 71, 0.5); }
        .logo-desc { font-size: 10px; font-weight: 700; letter-spacing: 3px; color: #94a3b8; margin-top: 4px; }

        /* CENTER TABLET FRAME WITH NEON GLOW */
        .tablet-container {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 16/9;
            background: #020617;
            border-radius: 24px;
            padding: 10px;
            box-shadow: 0 0 30px #0284c7, inset 0 0 15px rgba(2, 132, 199, 0.5);
            border: 2px solid #38bdf8;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* BADGE OVERLAY ON VIDEO */
        .status-badge {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(234, 179, 8, 0.5);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        .dot-green {
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
        }

        /* INTERACTIVE BUTTONS & DIALOG */
        .btn-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .dialog-text {
            font-size: 15px;
            font-weight: 700;
            color: #fde047;
            margin-bottom: 12px;
            letter-spacing: 1px;
            line-height: 1.4;
            text-shadow: 0 0 8px rgba(234, 179, 8, 0.4);
        }

        .touch-btn {
            width: 100%;
            background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 100%);
            color: #020617;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2px;
            padding: 16px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .touch-btn:active {
            transform: scale(0.98);
        }

        /* BUTANG EXIT TOUR */
        .exit-btn {
            width: 100%;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid rgba(239, 68, 68, 0.5);
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .exit-btn:active {
            background: rgba(239, 68, 68, 0.3);
            transform: scale(0.98);
        }

        .tap-sub {
            font-size: 10px;
            letter-spacing: 3px;
            color: #94a3b8;
            margin-top: 8px;
            font-weight: 600;
        }

        /* BOTTOM CONNECTION BAR */
        .connection-bar {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid #ef4444;
            border-radius: 25px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.2);
            margin-bottom: 5px;
            backdrop-filter: blur(5px);
        }

        .status-light {
            width: 20px;
            height: 20px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 15px #ef4444;
            flex-shrink: 0;
        }

        .status-title { font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #ffffff; }
        .status-desc { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: #f87171; margin-top: 2px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- HEADER TOP WITH GOLD GLOW -->
    <div class="header">
        <div class="logo-title">BATIK BUDDY</div>
        <div class="logo-sub">BY KRUSS MAKERS</div>
        <div class="logo-desc">YOUR BATIK MUSEUM GUIDE</div>
    </div>

    <!-- PAPARAN 1: SLEEP MODE -->
    <div id="screen1" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="tablet-container">
            <div class="video-wrapper">
                <video id="sleepVid" autoplay loop muted playsinline>
                    <source src="BATIK BUDDY SLEEP.mp4" type="video/mp4">
                </video>
                <div class="status-badge">
                    <span class="dot-green" style="background-color: #eab308; box-shadow: 0 0 8px #eab308;"></span>
                    BUDDY IS IN SLEEP MODE
                </div>
            </div>
        </div>

        <div class="btn-container">
            <button class="touch-btn" onclick="goToWakeup()">
                ✦ TOUCH HERE TO BEGIN TOUR
            </button>
            <div class="tap-sub">TAP TO WAKE BUDDY</div>
        </div>
    </div>

    <!-- PAPARAN 2: WAKEUP MODE -->
    <div id="screen2" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="tablet-container">
            <div class="video-wrapper">
                <video id="wakeupVid" loop muted playsinline>
                    <source src="BATIK BUDDY WAKEUP.mp4" type="video/mp4">
                </video>
                <div class="status-badge">
                    <span class="dot-green"></span>
                    BUDDY IS AWAKE
                </div>
            </div>
        </div>

        <div class="btn-container">
            <div class="dialog-text">“Hi! I'm Batik Buddy, your Batik Museum guide.”</div>
            <button class="touch-btn" onclick="goToLanguage()">
                CONTINUE TO SELECT LANGUAGE ➔
            </button>
            <button class="exit-btn" onclick="exitToSleep()">
                ✖ EXIT TOUR
            </button>
        </div>
    </div>

    <!-- BOTTOM CONNECTION BAR -->
    <div class="connection-bar">
        <div class="status-light"></div>
        <div>
            <div class="status-title">iPad ⇄ SPIKE PRIME</div>
            <div class="status-desc">NOT CONNECTED<br>SIMULATION MODE</div>
        </div>
    </div>

    <script>
        function goToWakeup() {
            document.getElementById('screen1').classList.add('hidden');
            document.getElementById('sleepVid').pause();

            document.getElementById('screen2').classList.remove('hidden');
            let wVid = document.getElementById('wakeupVid');
            wVid.currentTime = 0;
            wVid.play();
        }

        function exitToSleep() {
            document.getElementById('screen2').classList.add('hidden');
            document.getElementById('wakeupVid').pause();

            document.getElementById('screen1').classList.remove('hidden');
            let sVid = document.getElementById('sleepVid');
            sVid.currentTime = 0;
            sVid.play();
        }

        function goToLanguage() {
            alert("Sedia untuk bina Paparan 3 (Pilihan Bahasa)!");
        }
    </script>

</body>
</html>
